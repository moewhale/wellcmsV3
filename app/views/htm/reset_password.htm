<?php if (1 === $view->get('step')): ?>
<script ajax-eval="true">
    (function () {
        const send = document.getElementById("send-code");
        if (!send) return;

        send.addEventListener("click", async function (event) {
            event.preventDefault();
            if (send.classList.contains("loading")) return;

            send.classList.add("loading");
            try {
                const response = await wellcms.post(send.getAttribute("href"), {
                    email: document.querySelector('input[name="email"]')?.value || "",
                    _token: document.querySelector('input[name="_token"]')?.value || "",
                    key: "resetPassword"
                });

                if (response.code === 0) {
                    wellcms.toast(response.message || document.getElementById("sending-completed")?.textContent.trim() || "Success", "success");
                    startCountdown(send, 60);
                } else {
                    showFieldError(response);
                }
            } catch (error) {
                wellcms.error(error.message || "Request failed");
            } finally {
                send.classList.remove("loading");
            }
        });

        function startCountdown(send, seconds) {
            const completed = document.getElementById("sending-completed");
            const countdown = document.getElementById("countdown");
            if (!completed || !countdown) return;

            let remaining = seconds;
            send.style.display = "none";
            completed.style.display = "";
            countdown.style.display = "";
            countdown.textContent = remaining;

            const timer = setInterval(function () {
                remaining--;
                countdown.textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(timer);
                    countdown.style.display = "none";
                    completed.style.display = "none";
                    send.style.display = "";
                }
            }, 1000);
        }

        function showFieldError(response) {
            const field = response.data?.field || (typeof response.code === "string" ? response.code : "");
            if (field && document.querySelector('[name="' + field + '"]')) {
                wellcms.showInputError(field, response.message || "Invalid input");
                return;
            }
            wellcms.error(response.message || "Request failed");
        }
    })();
</script>
