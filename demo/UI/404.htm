<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：404 页面（对应 app/views/htm/404.htm）
    纯静态演示稿：无 PHP 标签，演示数据直接内嵌；配色取自 Idea Box 提示词（暖白底 / 墨色 / 钴蓝）
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="keywords" content="404 - 页面不存在 | WellCMS">
    <meta name="description" content="404 - 页面不存在 | WellCMS">
    <title>404 - 页面不存在 | WellCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        /* Tailwind CDN 未覆盖的自定义动画补充 */
        @keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
        .animate-blob{animation:blob 7s infinite}
        @keyframes spin-slow{to{transform:rotate(360deg)}}
        .animate-spin-slow{animation:spin-slow 8s linear infinite}
    </style>
</head>
<body class="bg-stone-50 dark:bg-slate-900 text-stone-800 dark:text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Blobs -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[10%] right-[10%] w-72 h-72 bg-blue-500/10 blur-3xl animate-blob"></div>
        <div class="absolute bottom-[10%] left-[10%] w-72 h-72 bg-violet-500/10 blur-3xl animate-blob" style="animation-delay:2s"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-400/5 blur-3xl animate-blob" style="animation-delay:4s"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg text-center">
        <!-- 404 Illustrative Element -->
        <div class="mb-12 relative animate-bounce">
            <h1 class="text-9xl font-black text-blue-600/15">404</h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-stone-200 dark:border-slate-700">
                    <svg class="w-16 h-16 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div class="p-10 rounded-3xl shadow-xl border border-stone-200 dark:border-slate-700 mb-8 bg-white dark:bg-slate-800">
            <h2 class="text-3xl font-black text-stone-900 dark:text-white mb-4">页面走丢了</h2>
            <p class="text-stone-500 dark:text-gray-400 mb-8">你要找的页面不存在，可能已被移动或删除。检查一下地址，或者回到首页重新出发。</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="index.htm" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all hover:scale-105 active:scale-95">返回首页</a>
                <button onclick="history.back()" class="px-8 py-3 bg-white dark:bg-slate-800 border border-stone-200 dark:border-gray-700 text-stone-600 dark:text-gray-200 font-bold rounded-xl hover:bg-stone-50 dark:hover:bg-slate-700 transition-all hover:scale-105 active:scale-95">返回上一页</button>
            </div>
        </div>

        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-center space-x-6 text-sm text-stone-400">
            <button onclick="wellcms.toggleDarkMode()" class="p-2 rounded-lg hover:bg-white/60 dark:hover:bg-black/20 transition-colors">
                <span class="dark:hidden">🌙 深色模式</span><span class="hidden dark:inline">☀️ 浅色模式</span>
            </button>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
