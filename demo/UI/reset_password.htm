<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：重置密码页（对应 app/views/htm/reset_password.htm）
    布局：左侧品牌面板（琥珀色块）+ 右侧表单（Idea Box 风格，无渐变）
    纯静态演示稿：渲染「第 1 步：验证邮箱与验证码」；第 2 步结构以注释标出；脚本省略
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>重置密码 - WellCMS 演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-stone-100 dark:bg-slate-950 font-sans text-stone-800 dark:text-gray-200">

<div class="min-h-screen flex">

    <!-- 左侧品牌面板 -->
    <div class="hidden lg:flex lg:w-[46%] bg-amber-400 relative overflow-hidden flex-col justify-between p-12 text-stone-900">
        <!-- 玩乐几何装饰 -->
        <div class="absolute -top-16 -left-16 w-64 h-64 rounded-full bg-rose-400"></div>
        <div class="absolute top-1/3 -right-20 w-72 h-72 rounded-3xl rotate-12 bg-violet-500"></div>
        <div class="absolute bottom-10 left-16 w-24 h-24 rounded-full bg-blue-600"></div>
        <div class="absolute bottom-32 right-24 w-10 h-10 rounded-lg rotate-45 bg-emerald-400"></div>

        <a href="index.htm" class="relative z-10 flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-stone-900 flex items-center justify-center text-amber-400 font-black shadow-lg">W</div>
            <span class="text-xl font-black tracking-tight">WellCMS <span class="opacity-60">3.0</span></span>
        </a>

        <div class="relative z-10">
            <h1 class="text-4xl xl:text-5xl font-black leading-tight tracking-tight">忘记密码？<br>小事一桩。</h1>
            <p class="mt-4 text-stone-700 max-w-sm font-medium">通过注册邮箱接收验证码，两步即可重置密码，重新回到社区。</p>
            <div class="mt-8 inline-flex items-center gap-3 bg-white/70 rounded-2xl px-5 py-4 shadow-sm">
                <svg class="w-8 h-8 text-stone-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                <div class="text-sm"><div class="font-black">全程加密验证</div><div class="text-stone-500 text-xs">验证码 10 分钟内有效</div></div>
            </div>
        </div>

        <p class="relative z-10 text-xs text-stone-600">© 2026 WellCMS 演示站 · UI 演示稿</p>
    </div>

    <!-- 右侧表单面板 -->
    <div class="flex-1 flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <div class="lg:hidden mb-8 flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-amber-400 flex items-center justify-center text-stone-900 font-black text-sm">W</div>
                <span class="text-xl font-black text-stone-900 dark:text-white">WellCMS 3.0</span>
            </div>

            <h2 class="text-3xl font-black text-stone-900 dark:text-white tracking-tight">重置密码</h2>
            <p class="mt-2 text-stone-400">验证你的邮箱，然后设置新密码。</p>

            <!-- 步骤指示 -->
            <div class="mt-6 flex items-center gap-2 text-xs font-bold">
                <span class="flex items-center gap-1.5 text-blue-600"><span class="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px]">1</span>验证邮箱</span>
                <span class="w-8 h-px bg-stone-300 dark:bg-slate-700"></span>
                <span class="flex items-center gap-1.5 text-stone-400"><span class="w-5 h-5 rounded-full bg-stone-200 dark:bg-slate-700 text-stone-500 flex items-center justify-center text-[10px]">2</span>设置新密码</span>
            </div>

            <div class="mt-6 bg-white dark:bg-slate-900 rounded-2xl border border-stone-200 dark:border-slate-800 shadow-sm p-6 sm:p-8">
                <div class="ajax-body">
                    <form class="ajax-form space-y-4" data-loading-text="加载中…" action="#" method="post" id="form">

                        <!-- 第 1 步：验证邮箱与验证码 -->
                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">注册邮箱</label>
                            <input type="email" name="email" id="email" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="you@example.com" required>
                        </div>

                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">邮箱验证码</label>
                            <div class="relative flex items-center">
                                <input type="text" name="code" id="code" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="6 位数字验证码" required>
                                <div class="absolute right-3 flex items-center bg-transparent">
                                    <a id="send-code" href="#" class="text-sm text-blue-600 font-bold hover:underline">发送验证码</a>
                                    <span id="sending-completed" class="text-sm text-emerald-600 font-bold" style="display:none;">发送成功</span>
                                    <span id="countdown" class="text-sm text-stone-400 ml-2" style="display:none;">60</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2">
                            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl shadow-lg shadow-blue-500/25 transition-all hover:-translate-y-0.5 tracking-widest">下一步</button>
                        </div>

                        <!-- 第 2 步（原文件 step !== 1 分支，演示稿不渲染）：
                             新密码 password + 确认密码 repeatPassword + 提交按钮 -->
                    </form>
                </div>
            </div>

            <p class="mt-6 text-center text-sm">
                <a href="sign_in.htm" class="text-blue-600 font-black hover:underline">← 返回登录</a>
            </p>
        </div>
    </div>
</div>

<!-- 原文件脚本位：邮箱验证码发送与倒计时（演示稿省略） -->
<script src="../assets/js/main.js"></script>
</body>
</html>
