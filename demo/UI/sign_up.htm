<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：注册页（对应 app/views/htm/sign_up.htm）
    布局：左侧品牌面板（钴蓝色块）+ 右侧表单（Idea Box 风格，无渐变）
    纯静态演示稿：渲染「用户名 + 邮箱 + 验证码 + 密码」完整分支；发码脚本省略
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>注册 - WellCMS 演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-stone-100 dark:bg-slate-950 font-sans text-stone-800 dark:text-gray-200">

<div class="min-h-screen flex">

    <!-- 左侧品牌面板 -->
    <div class="hidden lg:flex lg:w-[46%] bg-blue-600 relative overflow-hidden flex-col justify-between p-12 text-white">
        <!-- 玩乐几何装饰 -->
        <div class="absolute -top-16 -right-16 w-64 h-64 rounded-full bg-violet-500"></div>
        <div class="absolute top-1/3 -left-20 w-72 h-72 rounded-3xl -rotate-12 bg-emerald-400"></div>
        <div class="absolute bottom-16 right-16 w-24 h-24 rounded-full bg-amber-400"></div>
        <div class="absolute bottom-40 left-24 w-10 h-10 rounded-lg rotate-45 bg-rose-400"></div>

        <a href="index.htm" class="relative z-10 flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-white flex items-center justify-center text-blue-600 font-black shadow-lg">W</div>
            <span class="text-xl font-black tracking-tight">WellCMS <span class="opacity-70">3.0</span></span>
        </a>

        <div class="relative z-10">
            <h1 class="text-4xl xl:text-5xl font-black leading-tight tracking-tight">两分钟，<br>开启你的内容站点。</h1>
            <p class="mt-4 text-blue-100 max-w-sm font-medium">发帖、写文章、建合集，和社区一起分享值得构建的点子。</p>
            <ul class="mt-8 space-y-2 text-sm font-bold text-blue-50">
                <li class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-emerald-400 text-emerald-900 flex items-center justify-center text-[10px]">✓</span>免费注册，即刻发帖</li>
                <li class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-emerald-400 text-emerald-900 flex items-center justify-center text-[10px]">✓</span>插件生态，无限扩展</li>
                <li class="flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-emerald-400 text-emerald-900 flex items-center justify-center text-[10px]">✓</span>深色模式，随心切换</li>
            </ul>
        </div>

        <p class="relative z-10 text-xs text-blue-200">© 2026 WellCMS 演示站 · UI 演示稿</p>
    </div>

    <!-- 右侧表单面板 -->
    <div class="flex-1 flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">
            <div class="lg:hidden mb-8 flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-black text-sm">W</div>
                <span class="text-xl font-black text-stone-900 dark:text-white">WellCMS 3.0</span>
            </div>

            <h2 class="text-3xl font-black text-stone-900 dark:text-white tracking-tight">创建账号</h2>
            <p class="mt-2 text-stone-400">现在就加入我们的社区吧。</p>

            <div class="mt-8 bg-white dark:bg-slate-900 rounded-2xl border border-stone-200 dark:border-slate-800 shadow-sm p-6 sm:p-8">
                <div class="ajax-body">
                    <form class="ajax-form space-y-4" data-loading-text="加载中…" action="#" method="post" id="form">
                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">用户名</label>
                            <input type="text" name="username" id="username" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-rose-400 transition-all" placeholder="2-20 个字符，支持中文" required>
                        </div>

                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">邮箱</label>
                            <input type="email" name="email" id="email" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-rose-400 transition-all" placeholder="you@example.com" required>
                        </div>

                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">邮箱验证码</label>
                            <div class="relative flex items-center">
                                <input type="text" name="code" id="code" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-rose-400 transition-all" placeholder="6 位数字验证码" required>
                                <div class="absolute right-3 flex items-center bg-transparent">
                                    <a id="send-code" href="#" class="text-sm text-blue-600 font-bold hover:underline">发送验证码</a>
                                    <span id="sending-completed" class="text-sm text-emerald-600 font-bold" style="display:none;">发送成功</span>
                                    <span id="countdown" class="text-sm text-stone-400 ml-2" style="display:none;">60</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">密码</label>
                            <input type="password" name="password" id="password" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-rose-400 transition-all" placeholder="至少 8 位，建议包含字母与数字" required>
                        </div>

                        <div>
                            <label class="block text-xs font-black mb-1.5 text-stone-500 dark:text-gray-400 uppercase tracking-wider">确认密码</label>
                            <input type="password" name="repeatPassword" id="repeatPassword" class="w-full px-4 py-3 rounded-xl border border-stone-200 dark:border-slate-700 bg-stone-50 dark:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-rose-400 transition-all" placeholder="再次输入密码" required>
                        </div>

                        <div class="pt-2">
                            <button type="submit" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-black rounded-xl shadow-lg shadow-rose-500/25 transition-all hover:-translate-y-0.5 tracking-widest">创建账号</button>
                        </div>
                    </form>
                </div>

                <!-- 第三方/社交登录（原文件默认注释保留） -->
            </div>

            <p class="mt-6 text-center text-sm text-stone-400">
                已有账号？
                <a href="sign_in.htm" class="text-blue-600 font-black hover:underline ml-1">直接登录</a>
            </p>
        </div>
    </div>
</div>

<!-- 原文件脚本位：30 分钟 token 失效刷新、邮箱验证码发送与倒计时（演示稿省略） -->
<script src="../assets/js/main.js"></script>
</body>
</html>
