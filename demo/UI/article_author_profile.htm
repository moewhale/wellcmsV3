<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：作者资料编辑（对应 plugins/well_article/views/htm/article_author_profile.htm）
    布局：用户中心深色侧栏骨架（指挥中心风格）
    功能：作者字段表单（笔名/机构/资历/专长） + 管理员的公开可见开关 + 保存/返回
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>作者资料 - 用户中心 - WellCMS 演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-gray-100 dark:bg-slate-950 font-sans text-gray-800 dark:text-gray-200">
<div class="flex min-h-screen">

    <!-- 深色导航侧栏 -->
    <aside class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-slate-300 hidden lg:flex lg:flex-col border-r border-slate-800">
        <div class="px-5 h-16 flex items-center gap-2.5 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-indigo-500/30">W</div>
            <div><div class="text-white font-extrabold leading-none tracking-tight">WellCMS</div><div class="text-[10px] text-slate-500 mt-0.5">用户中心</div></div>
        </div>
        <div class="px-5 py-5 border-b border-slate-800 flex items-center gap-3">
            <span class="relative w-11 h-11 rounded-xl bg-gradient-to-br from-rose-400 to-amber-500 flex items-center justify-center text-white font-black text-lg shrink-0">林<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full ring-2 ring-slate-900"></span></span>
            <div class="min-w-0"><div class="text-sm font-bold text-white truncate">林晓雨</div><div class="text-[11px] text-slate-500">管理员 · UID 10001</div></div>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1 text-sm scrollbar-hide">
            <div class="px-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">概览</div>
            <a href="my_home.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>📊</span>个人首页</a>
            <a href="manage_dashboard.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>🛡️</span>管理面板</a>
            <div class="px-3 pt-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">内容</div>
            <a href="my_threads.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>📝</span>我的帖子</a>
            <a href="my_replies.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>💬</span>我的回复</a>
            <a href="my_article_index.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-500/15 text-white font-bold"><span>📰</span>我的文章</a>
            <a href="my_favorites.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>⭐</span>我的收藏</a>
            <a href="my_collections.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>📁</span>我的合集</a>
            <a href="my_drafts.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>🗂️</span>草稿箱</a>
            <div class="px-3 pt-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">账号</div>
            <a href="my_username.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>⚙️</span>资料设置</a>
        </nav>
        <div class="px-3 py-4 border-t border-slate-800">
            <button class="ajax-post w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 text-sm font-bold transition-colors" data-confirm="确认退出登录？"><span>⏻</span>退出登录</button>
        </div>
    </aside>

    <!-- 内容画布 -->
    <div class="flex-1 lg:ml-64 min-w-0 flex flex-col">
        <header class="sticky top-0 z-30 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-gray-200 dark:border-slate-800 flex items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="text-sm"><span class="text-gray-400">用户中心</span><span class="mx-1.5 text-gray-300 dark:text-slate-600">/</span><span class="text-gray-400">我的文章</span><span class="mx-1.5 text-gray-300 dark:text-slate-600">/</span><b class="text-gray-900 dark:text-white">作者资料</b></div>
            <div class="flex items-center gap-2">
                <button onclick="wellcms.toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition-colors" title="切换深浅色"><span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span></button>
                <span class="lg:hidden w-8 h-8 rounded-lg bg-gradient-to-br from-rose-400 to-amber-500 flex items-center justify-center text-white text-sm font-bold">林</span>
            </div>
        </header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8" id="main-content">
            <div class="max-w-2xl">
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <header class="border-b border-gray-100 dark:border-slate-800 px-6 py-4">
                        <h1 class="text-lg font-extrabold text-gray-900 dark:text-white">作者资料</h1>
                        <p class="text-xs text-gray-400 mt-1">这些信息会展示在你的作者主页与文章署名处</p>
                    </header>
                    <form class="ajax-form space-y-5 p-6" method="post" action="#">
                        <div>
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider" for="display_name">显示名称（笔名）</label>
                            <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800/60 dark:text-gray-100 transition-all" type="text" id="display_name" name="display_name" maxlength="30" value="林晓雨">
                        </div>
                        <div>
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider" for="organization">所属机构</label>
                            <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800/60 dark:text-gray-100 transition-all" type="text" id="organization" name="organization" maxlength="60" value="WellCMS 社区">
                        </div>
                        <div>
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider" for="credentials">资历</label>
                            <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800/60 dark:text-gray-100 transition-all" type="text" id="credentials" name="credentials" maxlength="60" value="6 年 PHP 全栈开发">
                        </div>
                        <div>
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider" for="expertise">擅长领域</label>
                            <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800/60 dark:text-gray-100 transition-all" type="text" id="expertise" name="expertise" maxlength="60" value="插件开发 / 前端工程化">
                        </div>

                        <!-- 管理员可见（原文件 manage 分支） -->
                        <div>
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider" for="author-profile-is-public">作者主页可见性</label>
                            <select id="author-profile-is-public" name="is_public" class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800/60 dark:text-gray-100 transition-all">
                                <option value="1" selected>公开</option>
                                <option value="0">隐藏</option>
                            </select>
                        </div>

                        <div class="flex flex-wrap items-center gap-3 border-t border-gray-100 pt-5 dark:border-slate-800">
                            <button type="submit" class="inline-flex items-center justify-center gap-1 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white transition hover:bg-indigo-700 shadow-lg shadow-indigo-500/25">保存</button>
                            <a class="inline-flex items-center justify-center gap-1 rounded-xl border border-gray-200 bg-white px-5 py-2.5 text-sm font-bold text-gray-600 transition hover:bg-gray-50 dark:border-slate-700 dark:bg-slate-800 dark:text-gray-300 dark:hover:bg-slate-700" href="my_article_index.htm">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="border-t border-gray-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-gray-400">
            <span>© 2026 <a target="_blank" href="http://www.wellcms.com/" class="font-bold hover:text-indigo-600">WellCMS</a> 演示站 · 页面为 UI 演示稿</span>
            <span>Processed: <b>0.0198</b>, SQL: <b>12</b></span>
        </footer>
    </div>
</div>
<script src="../assets/js/main.js"></script>
</body>
</html>
