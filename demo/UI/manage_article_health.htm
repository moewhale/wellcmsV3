<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：内容健康巡检（对应 plugins/well_article/views/htm/manage_article_health.htm）
    布局：用户中心深色侧栏骨架
    功能：批量健康检查（URL 列表） / 问题列表（文章 + 异常码） / 修复表单（修复类型、原因、统计字段） / 分页
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>健康巡检 - 用户中心 - WellCMS 演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-gray-100 dark:bg-slate-950 font-sans text-gray-800 dark:text-gray-200">
<div class="flex min-h-screen">

    <!-- 深色导航侧栏 -->
    <aside class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-slate-300 hidden lg:flex lg:flex-col border-r border-slate-800">
        <div class="px-5 h-16 flex items-center gap-2.5 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-indigo-500/30">W</div>
            <div><div class="text-white font-extrabold leading-none tracking-tight">WellCMS</div><div class="text-[10px] text-slate-500 mt-0.5">用户中心</div></div>
        </div>
        <div class="px-5 py-5 border-b border-slate-800 flex items-center gap-3">
            <span class="relative w-11 h-11 rounded-xl bg-gradient-to-br from-rose-400 to-amber-500 flex items-center justify-center text-white font-black text-lg shrink-0">林<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full ring-2 ring-slate-900"></span></span>
            <div class="min-w-0"><div class="text-sm font-bold text-white truncate">林晓雨</div><div class="text-[11px] text-slate-500">管理员 · UID 10001</div></div>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1 text-sm scrollbar-hide">
            <div class="px-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">概览</div>
            <a href="my_home.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>📊</span>个人首页</a>
            <a href="manage_dashboard.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>🛡️</span>管理面板</a>
            <div class="px-3 pt-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">管理</div>
            <a href="manage_article_index.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>🗃️</span>文章管理</a>
            <a href="manage_article_comment.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>💬</span>评论管理</a>
            <a href="manage_article_audit.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>✅</span>文章审核</a>
            <a href="manage_article_report.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>🚩</span>举报处理</a>
            <a href="manage_article_ban.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition-colors"><span>⛔</span>用户限制</a>
            <a href="manage_article_health.htm" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-500/15 text-white font-bold"><span>🩺</span>健康巡检</a>
        </nav>
        <div class="px-3 py-4 border-t border-slate-800">
            <button class="ajax-post w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 text-sm font-bold transition-colors" data-confirm="确认退出登录？"><span>⏻</span>退出登录</button>
        </div>
    </aside>

    <!-- 内容画布 -->
    <div class="flex-1 lg:ml-64 min-w-0 flex flex-col">
        <header class="sticky top-0 z-30 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-gray-200 dark:border-slate-800 flex items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="text-sm"><span class="text-gray-400">管理</span><span class="mx-1.5 text-gray-300 dark:text-slate-600">/</span><b class="text-gray-900 dark:text-white">健康巡检</b></div>
            <div class="flex items-center gap-2">
                <button onclick="wellcms.toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition-colors" title="切换深浅色"><span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span></button>
                <span class="lg:hidden w-8 h-8 rounded-lg bg-gradient-to-br from-rose-400 to-amber-500 flex items-center justify-center text-white text-sm font-bold">林</span>
            </div>
        </header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8" id="main-content">
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <header class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-100 px-6 py-4 dark:border-slate-800">
                    <h1 class="text-lg font-extrabold text-gray-900 dark:text-white">健康巡检</h1>
                    <strong class="inline-flex items-center gap-1 rounded-full border border-blue-200 bg-blue-50 px-3 py-1 text-xs font-black text-blue-700 dark:border-blue-500/40 dark:bg-blue-500/10 dark:text-blue-400">已检查 2,384 篇</strong>
                </header>

                <!-- 批量检查 -->
                <section class="space-y-4 p-6">
                    <form class="grid grid-cols-1 items-end gap-3 md:grid-cols-2" action="#" method="get">
                        <label class="block">
                            <span class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">文章 URL（每行一个）</span>
                            <textarea class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800/60 transition-all font-mono" name="articleUrls" rows="4" maxlength="200000" required placeholder="https://demo.wellcms.local/article/1024.html&#10;https://demo.wellcms.local/article/1025.html"></textarea>
                        </label>
                        <button class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-indigo-700 shadow-lg shadow-indigo-500/25" type="submit">开始检查</button>
                    </form>
                </section>

                <!-- 问题列表 -->
                <section class="divide-y divide-gray-100 dark:divide-slate-800 border-t border-gray-100 dark:border-slate-800">
                    <article class="flex flex-wrap items-center justify-between gap-4 px-6 py-4 hover:bg-gray-50/60 dark:hover:bg-slate-800/40 transition-colors">
                        <a class="font-bold text-gray-900 transition hover:text-indigo-600 dark:text-gray-100" href="article_detail.htm">文章 #1088 · 旧版升级指南（2024）</a>
                        <code class="inline-flex items-center gap-1 rounded-full border border-amber-200 bg-amber-50 px-2 py-1 text-xs font-bold text-amber-700 dark:border-amber-500/40 dark:bg-amber-500/10 dark:text-amber-400">dead_link</code>
                    </article>
                    <article class="flex flex-wrap items-center justify-between gap-4 px-6 py-4 hover:bg-gray-50/60 dark:hover:bg-slate-800/40 transition-colors">
                        <a class="font-bold text-gray-900 transition hover:text-indigo-600 dark:text-gray-100" href="article_detail.htm">文章 #0973 · 2.x 主题开发备忘</a>
                        <code class="inline-flex items-center gap-1 rounded-full border border-amber-200 bg-amber-50 px-2 py-1 text-xs font-bold text-amber-700 dark:border-amber-500/40 dark:bg-amber-500/10 dark:text-amber-400">missing_cover</code>
                    </article>
                    <article class="flex flex-wrap items-center justify-between gap-4 px-6 py-4 hover:bg-gray-50/60 dark:hover:bg-slate-800/40 transition-colors">
                        <a class="font-bold text-gray-900 transition hover:text-indigo-600 dark:text-gray-100" href="article_detail.htm">文章 #0862 · 社区周报第 40 期</a>
                        <code class="inline-flex items-center gap-1 rounded-full border border-rose-200 bg-rose-50 px-2 py-1 text-xs font-bold text-rose-700 dark:border-rose-500/40 dark:bg-rose-500/10 dark:text-rose-400">stats_mismatch</code>
                    </article>
                </section>

                <!-- 修复表单 -->
                <section class="space-y-4 border-t border-gray-100 p-6 dark:border-slate-800">
                    <h2 class="text-base font-extrabold text-gray-900 dark:text-white flex items-center gap-2"><span class="w-2 h-5 rounded-full bg-emerald-500"></span>单篇修复</h2>
                    <form class="ajax-form grid grid-cols-1 gap-4 md:grid-cols-2" action="#" method="post">
                        <label class="block">
                            <span class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">文章 URL</span>
                            <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 dark:border-slate-700 dark:bg-slate-800/60 transition-all" name="articleUrl" type="url" maxlength="2000" required placeholder="https://demo.wellcms.local/article/1088.html">
                        </label>
                        <div class="block">
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">修复类型</label>
                            <select class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-800/60" name="repairType" required>
                                <option value="1">重建统计字段</option>
                                <option value="2">清理失效附件引用</option>
                                <option value="3">重建搜索索引</option>
                            </select>
                        </div>
                        <div class="block">
                            <label class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">原因</label>
                            <select class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-800/60" name="reasonCode" required>
                                <option value="1">巡检发现异常</option>
                                <option value="2">用户反馈</option>
                                <option value="3">例行维护</option>
                            </select>
                        </div>
                        <!-- 统计字段（repairType = 重建统计字段 时启用，演示稿静态展示） -->
                        <section class="grid grid-cols-2 gap-4 md:col-span-2">
                            <label class="block">
                                <span class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">阅读数</span>
                                <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-800/60" name="views" type="number" min="0" value="0">
                            </label>
                            <label class="block">
                                <span class="mb-2 block text-xs font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider">评论数</span>
                                <input class="block w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-800/60" name="comments" type="number" min="0" value="0">
                            </label>
                        </section>
                        <button class="inline-flex items-center justify-center rounded-xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-emerald-700 md:col-span-2 shadow-lg shadow-emerald-600/25" type="submit">执行修复</button>
                    </form>
                </section>
            </div>
        </main>

        <footer class="border-t border-gray-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-gray-400">
            <span>© 2026 <a target="_blank" href="http://www.wellcms.com/" class="font-bold hover:text-indigo-600">WellCMS</a> 演示站 · 页面为 UI 演示稿</span>
            <span>Processed: <b>0.0198</b>, SQL: <b>12</b></span>
        </footer>
    </div>
</div>
<script src="../assets/js/main.js"></script>
</body>
</html>
