<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：分享模态框（对应 plugins/well_article/views/htm/article_share_modal.htm）
    原文件为模态框碎片（含二维码渲染脚本）；演示稿以「遮罩 + 居中弹窗」静态呈现，
    微信渠道二维码用静态占位块代替，脚本省略
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>分享 - 模态框演示 - WellCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-stone-100 dark:bg-slate-950 font-sans text-stone-800 dark:text-gray-200">

    <!-- 模拟页面背景 -->
    <div class="max-w-3xl mx-auto p-8 space-y-4 opacity-60 select-none">
        <div class="h-8 w-2/3 rounded-lg bg-stone-200 dark:bg-slate-800"></div>
        <div class="h-4 w-full rounded bg-stone-200 dark:bg-slate-800"></div>
        <div class="h-4 w-5/6 rounded bg-stone-200 dark:bg-slate-800"></div>
    </div>

    <!-- 模态遮罩 + 弹窗 -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-stone-200 dark:border-slate-700 p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-black text-stone-900 dark:text-gray-100">分享文章</h2>
                <button type="button" onclick="wellcms.closeModal && wellcms.closeModal('wellcms-global-dialog')" class="p-1.5 rounded-lg text-stone-400 hover:bg-stone-100 dark:hover:bg-slate-800 transition-colors" aria-label="关闭">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <p class="mb-4 break-all rounded-xl bg-stone-100 px-4 py-3 text-xs font-mono text-stone-600 dark:bg-slate-800 dark:text-gray-300">
                https://demo.wellcms.local/article/1024.html
            </p>
            <ul class="grid grid-cols-2 gap-3 sm:grid-cols-3">
                <li class="rounded-xl border border-stone-200 p-3 text-center text-sm font-bold transition-shadow hover:shadow-md dark:border-slate-700">
                    <span class="block text-stone-900 dark:text-gray-100">微信</span>
                    <!-- 原文件此处由 kjua 渲染二维码；演示稿用静态占位 -->
                    <span class="mx-auto mt-2 flex h-32 w-32 items-center justify-center rounded-lg bg-stone-900 text-white text-[10px] font-mono leading-relaxed p-2 text-center" id="article-share-qrcode">二维码<br>占位</span>
                </li>
                <li class="rounded-xl border border-stone-200 p-3 text-center text-sm font-bold transition-shadow hover:shadow-md dark:border-slate-700 flex flex-col items-center justify-center gap-2">
                    <span class="w-9 h-9 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-black">博</span>
                    <a class="block text-blue-600 hover:text-blue-700 dark:text-blue-400" href="#" target="_blank" rel="noopener noreferrer">微博</a>
                </li>
                <li class="rounded-xl border border-stone-200 p-3 text-center text-sm font-bold transition-shadow hover:shadow-md dark:border-slate-700 flex flex-col items-center justify-center gap-2">
                    <span class="w-9 h-9 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-black">Q</span>
                    <a class="block text-blue-600 hover:text-blue-700 dark:text-blue-400" href="#" target="_blank" rel="noopener noreferrer">QQ</a>
                </li>
                <li class="rounded-xl border border-stone-200 p-3 text-center text-sm font-bold transition-shadow hover:shadow-md dark:border-slate-700 flex flex-col items-center justify-center gap-2">
                    <span class="w-9 h-9 rounded-full bg-amber-400 text-stone-900 flex items-center justify-center text-xs font-black">圈</span>
                    <a class="block text-blue-600 hover:text-blue-700 dark:text-blue-400" href="#" target="_blank" rel="noopener noreferrer">QQ 空间</a>
                </li>
                <li class="rounded-xl border border-stone-200 p-3 text-center text-sm font-bold transition-shadow hover:shadow-md dark:border-slate-700 flex flex-col items-center justify-center gap-2">
                    <span class="w-9 h-9 rounded-full bg-stone-900 text-white flex items-center justify-center text-xs font-black">X</span>
                    <a class="block text-blue-600 hover:text-blue-700 dark:text-blue-400" href="#" target="_blank" rel="noopener noreferrer">X</a>
                </li>
                <li class="rounded-xl border border-stone-200 p-3 text-center text-sm font-bold transition-shadow hover:shadow-md dark:border-slate-700 flex flex-col items-center justify-center gap-2">
                    <span class="w-9 h-9 rounded-full bg-sky-500 text-white flex items-center justify-center text-xs font-black">✈</span>
                    <a class="block text-blue-600 hover:text-blue-700 dark:text-blue-400" href="#" target="_blank" rel="noopener noreferrer">Telegram</a>
                </li>
            </ul>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
