<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：403 页面（对应 app/views/htm/403.htm）
    纯静态演示稿：无 PHP 标签，演示数据直接内嵌；珊瑚红警示色
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="keywords" content="403 - 无权访问 | WellCMS">
    <meta name="description" content="403 - 无权访问 | WellCMS">
    <title>403 - 无权访问 | WellCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        /* Tailwind CDN 未覆盖的自定义动画补充 */
        @keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
        .animate-blob{animation:blob 7s infinite}
    </style>
</head>
<body class="bg-stone-50 dark:bg-slate-900 text-stone-800 dark:text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Blobs -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[10%] right-[10%] w-72 h-72 bg-rose-500/10 blur-3xl animate-blob"></div>
        <div class="absolute bottom-[10%] left-[10%] w-72 h-72 bg-amber-500/10 blur-3xl animate-blob" style="animation-delay:2s"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-rose-500/5 blur-3xl animate-blob" style="animation-delay:4s"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg text-center">
        <!-- 403 Illustrative Element -->
        <div class="mb-12 relative animate-pulse">
            <h1 class="text-9xl font-black text-rose-500/15">403</h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-stone-200 dark:border-slate-700">
                    <svg class="w-16 h-16 text-rose-500 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div class="p-10 rounded-3xl shadow-xl border border-stone-200 dark:border-slate-700 mb-8 bg-white dark:bg-slate-800">
            <h2 class="text-3xl font-black text-stone-900 dark:text-white mb-4">没有访问权限</h2>
            <p class="text-stone-500 dark:text-gray-400 mb-8">抱歉，你当前的身份无法访问这个页面。如果你认为这是一个误会，请联系管理员开通权限。</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="index.htm" class="px-8 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg shadow-rose-500/30 transition-all hover:scale-105 active:scale-95">返回首页</a>
                <button onclick="history.back()" class="px-8 py-3 bg-white dark:bg-slate-800 border border-stone-200 dark:border-gray-700 text-stone-600 dark:text-gray-200 font-bold rounded-xl hover:bg-stone-50 dark:hover:bg-slate-700 transition-all hover:scale-105 active:scale-95">返回上一页</button>
            </div>
        </div>

        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-center space-x-6 text-sm text-stone-400">
            <button onclick="wellcms.toggleDarkMode()" class="p-2 rounded-lg hover:bg-white/60 dark:hover:bg-black/20 transition-colors">
                <span class="dark:hidden">🌙 深色模式</span><span class="hidden dark:inline">☀️ 浅色模式</span>
            </button>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
