<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：500 页面（对应 app/views/htm/500.htm）
    纯静态演示稿：无 PHP 标签，演示数据直接内嵌；紫色主色
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="keywords" content="500 - 服务器错误 | WellCMS">
    <meta name="description" content="500 - 服务器错误 | WellCMS">
    <title>500 - 服务器错误 | WellCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        /* Tailwind CDN 未覆盖的自定义动画补充 */
        @keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
        .animate-blob{animation:blob 7s infinite}
        @keyframes spin-slow{to{transform:rotate(360deg)}}
        .animate-spin-slow{animation:spin-slow 8s linear infinite}
    </style>
</head>
<body class="bg-stone-50 dark:bg-slate-900 text-stone-800 dark:text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Blobs -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[10%] right-[10%] w-72 h-72 bg-violet-500/10 blur-3xl animate-blob"></div>
        <div class="absolute bottom-[10%] left-[10%] w-72 h-72 bg-blue-500/10 blur-3xl animate-blob" style="animation-delay:2s"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/5 blur-3xl animate-blob" style="animation-delay:4s"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg text-center">
        <!-- 500 Illustrative Element -->
        <div class="mb-12 relative">
            <h1 class="text-9xl font-black text-violet-500/15">500</h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-stone-200 dark:border-slate-700">
                    <svg class="w-16 h-16 text-violet-600 dark:text-violet-400 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div class="p-10 rounded-3xl shadow-xl border border-stone-200 dark:border-slate-700 mb-8 bg-white dark:bg-slate-800">
            <h2 class="text-3xl font-black text-stone-900 dark:text-white mb-4">服务器开了个小差</h2>
            <p class="text-stone-500 dark:text-gray-400 mb-8">服务器内部出现错误，工程师正在抢修。请稍后再试，给你带来的不便敬请谅解。</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="index.htm" class="px-8 py-3 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl shadow-lg shadow-violet-600/30 transition-all hover:scale-105 active:scale-95">返回首页</a>
                <button onclick="location.reload()" class="px-8 py-3 bg-white dark:bg-slate-800 border border-stone-200 dark:border-gray-700 text-stone-600 dark:text-gray-200 font-bold rounded-xl hover:bg-stone-50 dark:hover:bg-slate-700 transition-all hover:scale-105 active:scale-95">重新加载</button>
            </div>
        </div>

        <!-- Dark Mode Toggle & Report -->
        <div class="flex items-center justify-center space-x-6 text-sm text-stone-400">
            <button onclick="wellcms.toggleDarkMode()" class="p-2 rounded-lg hover:bg-white/60 dark:hover:bg-black/20 transition-colors">
                <span class="dark:hidden">🌙 深色模式</span><span class="hidden dark:inline">☀️ 浅色模式</span>
            </button>
            <a href="#" class="hover:text-violet-600 font-semibold">反馈此问题</a>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
