<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：外链跳转安全提示页（对应 app/views/htm/external_link_redirect.htm）
    设计语言：暖白底 + 墨色文字 + 琥珀警示色
    演示数据：目标 URL 静态填充为示例链接；正式环境由 target_url 变量输出
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即将离开本站 | WellCMS</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fafaf9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 40px 32px;
            text-align: center;
        }
        .icon {
            width: 64px; height: 64px;
            margin: 0 auto 24px;
            background: #fef3c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 28px; height: 28px; color: #d97706; }
        h1 {
            font-size: 18px;
            font-weight: 800;
            color: #1c1917;
            margin-bottom: 12px;
        }
        .warning {
            font-size: 14px;
            color: #78716c;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .url-box {
            background: #f5f5f4;
            border: 1px solid #e7e5e4;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
            word-break: break-all;
        }
        .url-box p {
            font-size: 13px;
            color: #57534e;
            font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #1c1917;
            color: #fff;
            margin-bottom: 12px;
        }
        .btn-primary:hover { background: #44403c; }
        .btn-secondary {
            background: transparent;
            color: #78716c;
        }
        .btn-secondary:hover { color: #44403c; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <h1>你即将离开本站</h1>

        <p class="warning">
            以下链接来自用户发布的内容，本站无法保证外部页面的安全性，请谨慎访问，注意保护账号与财产信息。
        </p>

        <div class="url-box">
            <p>https://example-external-site.com/some/page?from=share</p>
        </div>

        <a href="https://example-external-site.com/some/page?from=share"
           rel="nofollow noopener noreferrer"
           class="btn btn-primary">
            我已知晓，继续访问
        </a>

        <a href="javascript:history.back()" class="btn btn-secondary">
            取消返回
        </a>
    </div>
</body>
</html>
