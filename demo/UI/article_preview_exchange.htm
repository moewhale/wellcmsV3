<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：预览令牌交换页（对应 plugins/well_article/views/htm/article_preview_exchange.htm）
    功能：编辑器新开窗口后，用一次性令牌换取预览会话并跳转预览页
    纯静态演示稿；令牌交换脚本（article_preview_script.inc.htm）省略，状态区保留
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>预览交换 - WellCMS 演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="flex flex-col min-h-screen bg-stone-50 dark:bg-slate-950 text-stone-900 dark:text-gray-200 font-sans">

    <header class="sticky top-0 z-50 bg-stone-50/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-stone-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.htm" class="flex items-center gap-2 shrink-0">
                    <div class="w-8 h-8 rounded-lg bg-rose-500 flex items-center justify-center text-white font-black text-sm shadow-md shadow-rose-500/30">W</div>
                    <span class="text-xl font-black tracking-tight">WellCMS <span class="text-rose-500">3.0</span></span>
                </a>
                <div class="flex items-center gap-2">
                    <button onclick="wellcms.toggleDarkMode()" class="p-2 rounded-lg hover:bg-stone-200 dark:hover:bg-white/10 transition-colors" title="切换深浅色"><span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span></button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 mx-auto w-full max-w-7xl px-4 py-12 md:px-8" id="main-content">
        <section class="rounded-2xl border border-stone-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm mx-auto max-w-lg p-6 md:p-8" aria-labelledby="article-preview-title">
            <div class="mx-auto mb-6 w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/25">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </div>
            <p class="mb-2 text-sm font-black text-blue-600 uppercase tracking-[0.2em] text-center">预览</p>
            <h1 class="mb-6 text-lg font-black text-center" id="article-preview-title">
                正在为你准备预览会话
            </h1>
            <form id="article-preview-exchange" class="space-y-4" action="#" method="post">
                <input type="hidden" name="token" value="">
                <button class="w-full inline-flex items-center justify-center gap-1 rounded-xl bg-blue-600 px-4 py-3 text-sm font-black text-white transition hover:bg-blue-700 shadow-lg shadow-blue-600/25" type="submit">
                    进入预览
                </button>
            </form>
            <p class="mt-4 flex flex-wrap items-center justify-center gap-2 text-xs text-stone-400 font-bold" data-preview-status aria-live="polite">
                正在交换预览令牌…
            </p>
        </section>
    </main>

    <footer class="border-t border-stone-200 dark:border-slate-800 bg-white/60 dark:bg-slate-950">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-stone-400">
            <span>© 2026 <a href="http://www.wellcms.com/" target="_blank" class="font-bold hover:text-rose-500">WellCMS</a> 演示站 · 页面为 UI 演示稿，数据均为演示数据</span>
            <span>Processed: <b>0.0231</b>, SQL: <b>18</b></span>
        </div>
    </footer>
    <script src="../assets/js/main.js"></script>
</body>
</html>
