<!DOCTYPE html>
<html lang="zh-CN">
<!--
    演示文件：举报模态框（对应 plugins/well_article/views/htm/article_report_modal.htm）
    原文件为 AJAX 模态框碎片；演示稿以「遮罩 + 居中弹窗」静态呈现
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>举报 - 模态框演示 - WellCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-stone-100 dark:bg-slate-950 font-sans text-stone-800 dark:text-gray-200">

    <!-- 模拟页面背景 -->
    <div class="max-w-3xl mx-auto p-8 space-y-4 opacity-60 select-none">
        <div class="h-8 w-2/3 rounded-lg bg-stone-200 dark:bg-slate-800"></div>
        <div class="h-4 w-full rounded bg-stone-200 dark:bg-slate-800"></div>
        <div class="h-4 w-5/6 rounded bg-stone-200 dark:bg-slate-800"></div>
    </div>

    <!-- 模态遮罩 + 弹窗 -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-stone-200 dark:border-slate-700 overflow-hidden">
            <div class="ajax-body">
                <form class="ajax-form space-y-4 p-6" action="#" method="post">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-black text-stone-900 dark:text-gray-100 flex items-center gap-2">
                            <span class="w-8 h-8 rounded-lg bg-rose-100 dark:bg-rose-500/15 text-rose-500 flex items-center justify-center">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 2H21l-3 5 3 5h-8.5l-1-2H5"/></svg>
                            </span>
                            举报内容
                        </h3>
                        <button type="button" onclick="wellcms.closeModal && wellcms.closeModal('wellcms-global-dialog')" class="p-1.5 rounded-lg text-stone-400 hover:bg-stone-100 dark:hover:bg-slate-800 transition-colors" aria-label="关闭">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <div class="rounded-xl bg-stone-50 dark:bg-slate-800/60 border border-stone-200 dark:border-slate-700 px-4 py-3 text-xs text-stone-500 dark:text-gray-400">
                        举报对象：评论 #1024 · 苏晚晴
                    </div>

                    <div class="block">
                        <label class="mb-2 block text-xs font-black text-stone-500 dark:text-gray-400 uppercase tracking-wider">举报原因</label>
                        <select class="block w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-slate-700 dark:bg-slate-800 dark:text-gray-100 transition-all" name="reasonCode" required>
                            <option value="1">垃圾广告</option>
                            <option value="2">人身攻击</option>
                            <option value="3">违法违规</option>
                            <option value="4">侵犯版权</option>
                            <option value="5">其他</option>
                        </select>
                    </div>
                    <label class="block">
                        <span class="mb-2 block text-xs font-black text-stone-500 dark:text-gray-400 uppercase tracking-wider">详细说明</span>
                        <textarea class="block w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-slate-700 dark:bg-slate-800 dark:text-gray-100 transition-all" name="detail" rows="4" maxlength="2000" required placeholder="请补充说明举报的具体原因…"></textarea>
                    </label>
                    <button class="w-full inline-flex items-center justify-center rounded-xl bg-rose-500 px-4 py-3 text-sm font-black text-white transition hover:bg-rose-600 shadow-md shadow-rose-500/25" type="submit">提交举报</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
